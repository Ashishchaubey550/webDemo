<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" class="navkar-logo-svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Emblem (Hex Gear + Monogram N) -->
  <g transform="translate(6, 6)">
    <!-- Outer Gear Silhouette -->
    <path d="M 30,3 L 36,3 L 37.5,7.5 L 43,9.5 L 47,6 L 51,10 L 47.5,14 L 49.5,19.5 L 54,21 L 54,27 L 49.5,28.5 L 47.5,34 L 51,38 L 47,42 L 43,38.5 L 37.5,40.5 L 36,45 L 30,45 L 28.5,40.5 L 23,38.5 L 19,42 L 15,38 L 18.5,34 L 16.5,28.5 L 12,27 L 12,21 L 16.5,19.5 L 18.5,14 L 15,10 L 19,6 L 23,9.5 L 28.5,7.5 Z" 
          fill="url(#gearGrad)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round" opacity="0.9" />

    <!-- Inner Circle Core -->
    <circle cx="33" cy="24" r="16" fill="#0B0F17" stroke="#334155" stroke-width="1.5" />

    <!-- Bold Industrial "N" Monogram -->
    <path d="M 23,33 L 23,15 L 28,15 L 37,27 L 37,15 L 42,15 L 42,33 L 37,33 L 28,21 L 28,33 Z" 
          fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Precision Flute Accent Line -->
    <path d="M 28,15 L 37,27" stroke="#FFF" stroke-width="0.8" opacity="0.6" stroke-linecap="round" />
    
    <!-- Mechanical Rivets -->
    <circle cx="21" cy="8" r="1.2" fill="#94A3B8" />
    <circle cx="45" cy="8" r="1.2" fill="#94A3B8" />
    <circle cx="21" cy="40" r="1.2" fill="#94A3B8" />
    <circle cx="45" cy="40" r="1.2" fill="#94A3B8" />
  </g>

  <!-- Typography Lockup -->
  <!-- Main Name: NAVKAR -->
  <text x="74" y="36" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="900" letter-spacing="2.5" fill="url(#titaniumGrad)">
    NAV<tspan fill="url(#goldGrad)">KAR</tspan>
  </text>

  <!-- Subtitle: TOOLS & MACHINERIES -->
  <text x="75" y="52" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#94A3B8">
    TOOLS &amp; MACHINERIES
  </text>

  <!-- Industrial Engineering Accent Bar -->
  <g transform="translate(75, 57)">
    <rect x="0" y="0" width="34" height="2" fill="url(#goldGrad)" rx="1" />
    <circle cx="39" cy="1" r="1.5" fill="#38BDF8" />
    <rect x="44" y="0" width="140" height="1" fill="#334155" />
    <text x="188" y="3" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="600" fill="#64748B" letter-spacing="1">EST. RAIPUR</text>
  </g>
</svg>
